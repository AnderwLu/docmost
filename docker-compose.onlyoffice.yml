services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
    image: anderwlu/docmost-onlyoffice:0.95.0
    environment:
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:?set ONLYOFFICE_INTERNAL_URL}
      ONLYOFFICE_BROWSER_URL: ${ONLYOFFICE_BROWSER_URL:?set ONLYOFFICE_BROWSER_URL}
      ONLYOFFICE_DOCMOST_URL: ${ONLYOFFICE_DOCMOST_URL:?set ONLYOFFICE_DOCMOST_URL}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET}
      ONLYOFFICE_TOKEN_SECRET: ${ONLYOFFICE_TOKEN_SECRET:?set ONLYOFFICE_TOKEN_SECRET}
      ONLYOFFICE_TOKEN_TTL_SECONDS: ${ONLYOFFICE_TOKEN_TTL_SECONDS:-1800}
    networks:
      - default
      - nextcloud-office-frontend

networks:
  nextcloud-office-frontend:
    external: true
